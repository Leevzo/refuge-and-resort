<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#f3f2ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a1120" media="(prefers-color-scheme: dark)">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="description" content="Short-stay hospitality. Have a furnished rental home or space you're not using? It could be making you money every month. Enter your info to see how much.">
<title>Refuge and Resort</title>
<link rel="stylesheet" href="style.css?v=20261117g">
</head>
<body>
<div id="tape" aria-hidden="true"></div>
<main>
  <h1><span>Refuge and</span> <span>Resort</span></h1>
  <p id="kind">Short-Stay Hospitality</p>
  <p id="line">Have a furnished rental home or space you&rsquo;re not using?<br>It could be making you money every month. Enter your info to see how much.</p>

  <div id="ask">
    <input id="zip" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="5" placeholder="ZIP code" aria-label="ZIP code" autocomplete="postal-code" spellcheck="false">
    <div id="rooms">
      <span class="step" data-for="beds">
        <button type="button" data-by="-1" aria-label="One fewer bedroom">&lsaquo;</button>
        <output id="beds">1</output>
        <button type="button" data-by="1" aria-label="One more bedroom">&rsaquo;</button>
        <span class="noun">bed</span>
      </span>
      <span class="step" data-for="baths">
        <button type="button" data-by="-1" aria-label="One fewer bathroom">&lsaquo;</button>
        <output id="baths">1</output>
        <button type="button" data-by="1" aria-label="One more bathroom">&rsaquo;</button>
        <span class="noun">bath</span>
      </span>
    </div>
  </div>

  <p id="money" aria-live="polite"></p>

</main>

  <button type="button" id="contact"><span>Contact us</span> <span class="at">Levi@refugeandresort.com</span></button>

<dialog id="letter" aria-labelledby="letter-title">
  <form id="letter-form" method="dialog">
    <h2 id="letter-title">Write to us</h2>
    <input id="from" type="email" placeholder="Your email" aria-label="Your email" autocomplete="email" required>
    <textarea id="words" rows="5" placeholder="Your message" aria-label="Your message" required></textarea>
    <div class="row">
      <button type="button" id="close">Close</button>
      <button type="submit" id="send">Send</button>
    </div>
  </form>
</dialog>

<footer>Refuge and Resort&trade; 2026</footer>
<script type="module" src="app.js?v=20261117e"></script>
</body>
</html>
